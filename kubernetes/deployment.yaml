
apiVersion: apps/v1
kind: Deployment
metadata:
  name: three-tier-app-deployment
  labels:
    app: three-tier-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: three-tier-app
  template:
    metadata:
      labels:
        app: three-tier-app
    spec:
      containers:
        - name: three-tier-app
          image: sarthakiparad2230/three-tier-app:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: three-tier-app-db-secrets
          env:
            - name: PORT
              value: "3000"
